name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pillow

      - name: Install app dependencies (needed for imports in tests)
        run: |
          pip install -r app/requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v

      - name: Install DVC with Google Drive support
        run: |
          pip install "dvc[gdrive]"
          pip install --upgrade pyopenssl cryptography

      - name: Pull model from DVC remote
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
        run: |
          dvc remote modify --local gdrive_remote gdrive_client_id "$GDRIVE_CLIENT_ID"
          dvc remote modify --local gdrive_remote gdrive_client_secret "$GDRIVE_CLIENT_SECRET"
          echo "$GDRIVE_CREDENTIALS_DATA" > /tmp/gdrive_creds.json
          dvc remote modify --local gdrive_remote gdrive_user_credentials_file /tmp/gdrive_creds.json
          dvc pull model/cats_dogs_cnn.h5.dvc
          cp model/cats_dogs_cnn.h5 app/cats_dogs_cnn.h5

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
                        -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                        ./app

      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
